name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Configure Git and fetch submodules
        shell: pwsh
        run: |
          git config --global core.longpaths true
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-i686-gcc
            mingw-w64-x86_64-make
            mingw-w64-i686-make

      - name: Select MSVC toolset
        shell: pwsh
        run: |
          if (Test-Path "${env:ProgramFiles}\Microsoft Visual Studio\2022") {
            $toolset = 'v143'
          } else {
            $toolset = 'v145'
          }
          "VCTOOLSET=$toolset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using PlatformToolset=$toolset"

      - name: Prepare output directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force HashCalculator\LibraryFiles | Out-Null
          New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Build hashalgs (x64)
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;C:\msys64\mingw32\bin;$env:PATH"
          cmake -S OpenHashLibs -B build\hashalgs-x64 -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_SH=CMAKE_SH-NOTFOUND `
            -DCMAKE_C_COMPILER=C:/msys64/mingw64/bin/gcc.exe `
            -DCMAKE_CXX_COMPILER=C:/msys64/mingw64/bin/g++.exe `
            -DCMAKE_MAKE_PROGRAM=C:/msys64/mingw64/bin/mingw32-make.exe
          cmake --build build\hashalgs-x64 --config Release --parallel
          Get-ChildItem HashCalculator\LibraryFiles\hashalgs_x64.dll | Select-Object Name,Length

      - name: Build hashalgs (x86)
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw32\bin;C:\msys64\mingw64\bin;$env:PATH"
          cmake -S OpenHashLibs -B build\hashalgs-x86 -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_SH=CMAKE_SH-NOTFOUND `
            -DCMAKE_C_COMPILER=C:/msys64/mingw32/bin/gcc.exe `
            -DCMAKE_CXX_COMPILER=C:/msys64/mingw32/bin/g++.exe `
            -DCMAKE_MAKE_PROGRAM=C:/msys64/mingw32/bin/mingw32-make.exe
          cmake --build build\hashalgs-x86 --config Release --parallel
          Get-ChildItem HashCalculator\LibraryFiles\hashalgs_x86.dll | Select-Object Name,Length

      - name: Build shell extension (x64/x86)
        shell: pwsh
        run: |
          $root = (Get-Location).Path + '\'
          msbuild HashCalculator.sln /t:ShellExtensions /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=$env:VCTOOLSET /p:SolutionDir="$root" /m /v:minimal
          msbuild HashCalculator.sln /t:ShellExtensions /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=$env:VCTOOLSET /p:SolutionDir="$root" /m /v:minimal
          Get-ChildItem HashCalculator\LibraryFiles\HashCalculator*.dll | Select-Object Name,Length

      - name: Publish app (x64)
        shell: pwsh
        run: |
          dotnet publish HashCalculator\HashCalculator.csproj -c Release `
            -p:Platform=x64 -p:RuntimeIdentifier=win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishProtocol=FileSystem `
            -o publish\x64
          Get-ChildItem publish\x64 -Force | Select-Object Name,Length

      - name: Publish app (x86)
        shell: pwsh
        run: |
          dotnet publish HashCalculator\HashCalculator.csproj -c Release `
            -p:Platform=x86 -p:RuntimeIdentifier=win-x86 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishProtocol=FileSystem `
            -o publish\x86
          Get-ChildItem publish\x86 -Force | Select-Object Name,Length

      - name: Package artifacts
        shell: pwsh
        run: |
          $x64 = Get-ChildItem publish\x64\*.exe | Select-Object -First 1
          $x86 = Get-ChildItem publish\x86\*.exe | Select-Object -First 1
          if (-not $x64 -or -not $x86) { throw 'Published exe not found.' }
          Compress-Archive -Path $x64.FullName -DestinationPath artifacts\HashCalculator-x64.zip -Force
          Compress-Archive -Path $x86.FullName -DestinationPath artifacts\HashCalculator-x86.zip -Force
          $lines = Get-ChildItem artifacts\*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $_.Name
          }
          $lines | Set-Content artifacts\SHA256SUMS.txt -Encoding utf8
          Get-ChildItem artifacts -Force | Select-Object Name,Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HashCalculator-build
          path: artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts\HashCalculator-x64.zip `
            artifacts\HashCalculator-x86.zip `
            artifacts\SHA256SUMS.txt `
            --generate-notes --verify-tag
